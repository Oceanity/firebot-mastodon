<eos-container header="Text">
  <firebot-input model="effect.text" use-text-area="true" placeholder-text="Status text" rows="4" cols="40"
    style="margin-bottom: 20px;" />
</eos-container>
<eos-container header="Content Warning">
  <firebot-input model="effect.cw" placeholder-text="Content warning" />
</eos-container>
<eos-container header="Visibility" pad-top="true">
  <div class="form-group">
    <firebot-radio-cards options="postVisibilityOptions" ng-model="effect.postVisibility" id="postVisibilityOptions"
      name="postVisibilityOptions" grid-columns="2"></firebot-radio-cards>
  </div>
</eos-container>
